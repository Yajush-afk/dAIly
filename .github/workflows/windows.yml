name: Windows application checks
on:
  push:
    branches: [main, 'build/**', 'feat/**', 'test/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-electron-install.mjs
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-electron-install.mjs
      - name: Prepare native SQLite for Node checks
        run: npm rebuild better-sqlite3
      - run: npm run check
      - name: Measure bounded history queries
        run: npm run benchmark:history
      - name: Prepare native SQLite for Electron
        run: npm run postinstall
      - run: node scripts/smoke.mjs
      - name: Build unsigned Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check installation, packaged app, and data preservation
        run: node scripts/check-package.mjs
      - name: Exercise installed application
        run: ./scripts/install-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke
          path: artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-windows-x64
          path: release/dAIly-Setup-*-x64.exe
