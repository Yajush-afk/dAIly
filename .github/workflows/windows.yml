name: Windows application checks
on:
  push:
    branches: [main, 'build/**', 'feat/**', 'test/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: bash -n start-ubuntu.sh setup-demo-db-ubuntu.sh
      - run: npm ci
      - run: node scripts/check-electron-install.mjs
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-electron-install.mjs
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: |
          foreach ($file in @('start-windows.ps1', 'setup-demo-db-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Verify portable demo transfer
        run: |
          ./setup-demo-db-windows.ps1
          npm run demo -- --export ./artifacts/ci-demo-transfer.db
          npm run demo -- --import ./artifacts/ci-demo-transfer.db --reset --seed-only
      - name: Prepare native SQLite for Node checks
        run: npm rebuild better-sqlite3
      - run: npm run check
      - name: Measure bounded history queries
        run: npm run benchmark:history
      - name: Prepare native SQLite for Electron
        run: npm run postinstall
      - run: node scripts/smoke.mjs
      - name: Build unsigned Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check installation, packaged app, and data preservation
        run: node scripts/check-package.mjs
      - name: Exercise installed application
        run: ./scripts/install-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke
          path: artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-windows-x64
          path: release/dAIly-Setup-*-x64.exe
